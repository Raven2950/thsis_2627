<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>记忆系统图</title>
<style>
@font-face {
  font-family: "Hand";
  src: local("HannotateSC-W5"), local("Hannotate SC"),
       url("file:///System/Library/AssetsV2/com_apple_MobileAsset_Font8/00bfc46ccb002b730e29def5116e0a571fb617d8.asset/AssetData/Hannotate.ttc");
}
html, body { margin: 0; background: #fbfbf8; }
svg { display: block; font-family: "Hand", "Kaiti SC", serif; }
.k { fill: #111; }
.b { fill: #1f3fae; }
.r { fill: #d0283a; }
</style>
</head>
<body>
<svg id="s" width="1790" height="1090" viewBox="0 0 1790 1090"></svg>
<script>
// A hand-drawn look: every line wobbles a little and is drawn twice.
const S = document.getElementById('s');
const NS = 'http://www.w3.org/2000/svg';
let seed = 11;
const rnd = (a) => { seed = (seed * 9301 + 49297) % 233280; return (seed / 233280 - 0.5) * 2 * a; };
const C = { k: '#111', b: '#1f3fae', r: '#d0283a' };

function el(tag, attrs, parent = S) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e); return e;
}
function wob(x1, y1, x2, y2, color, w = 1.8, dash) {
  for (let i = 0; i < 2; i++) {
    const mx = (x1 + x2) / 2 + rnd(2.2), my = (y1 + y2) / 2 + rnd(2.2);
    el('path', {
      d: `M${x1 + rnd(1.2)},${y1 + rnd(1.2)} Q${mx},${my} ${x2 + rnd(1.2)},${y2 + rnd(1.2)}`,
      stroke: color, 'stroke-width': i ? w * 0.6 : w, fill: 'none', 'stroke-linecap': 'round',
      ...(dash ? { 'stroke-dasharray': dash } : {}), opacity: i ? 0.55 : 1,
    });
  }
}
function box(x, y, w, h, color = C.k, dash) {
  wob(x, y, x + w, y, color, 2, dash); wob(x + w, y, x + w, y + h, color, 2, dash);
  wob(x + w, y + h, x, y + h, color, 2, dash); wob(x, y + h, x, y, color, 2, dash);
}
function head(x, y, ang, color) {
  for (const s of [-1, 1]) {
    const a = ang + Math.PI + s * 0.45;
    wob(x, y, x + Math.cos(a) * 14, y + Math.sin(a) * 14, color, 2);
  }
}
// Straight arrow; both = arrowheads at both ends.
function arrow(x1, y1, x2, y2, color, both) {
  wob(x1, y1, x2, y2, color, 2);
  head(x2, y2, Math.atan2(y2 - y1, x2 - x1), color);
  if (both) head(x1, y1, Math.atan2(y1 - y2, x1 - x2), color);
}
// Curved arrow through a control point.
function curve(x1, y1, cx, cy, x2, y2, color, both) {
  el('path', { d: `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`, stroke: color, 'stroke-width': 2, fill: 'none', 'stroke-linecap': 'round' });
  head(x2, y2, Math.atan2(y2 - cy, x2 - cx), color);
  if (both) head(x1, y1, Math.atan2(y1 - cy, x1 - cx), color);
}
// Text, one entry per line.
function txt(x, y, lines, cls = 'k', size = 20, anchor = 'start', lh = 1.32) {
  [].concat(lines).forEach((l, i) => {
    const t = el('text', { x, y: y + i * size * lh, class: cls, 'font-size': size, 'text-anchor': anchor });
    t.textContent = l;
  });
}
function card(x, y, w, h, title, lines, color = C.k) {
  box(x, y, w, h, color);
  txt(x + w / 2, y + 36, title, 'k', 26, 'middle');
  if (lines) txt(x + w / 2, y + 70, lines, 'k', 18, 'middle');
}

/* ---------- Row 1: what happened (blue) ---------- */
card(30, 50, 300, 170, '小时候 · 反抗', ['讨厌我妈，觉得她霸道、控制太过', '她是暴政，我是正当的反抗', '语言和行动上报复她 (9)']);

card(450, 50, 310, 170, '高中的我 · 有颜色', ['像特工一样躲着父母的审查', '一周三本书，走路吃饭都在读', '打球 · 跑步 · 听摇滚  (8)']);
txt(605, 250, '"黑白照片里有颜色的那一个" (7)', 'k', 17, 'middle');

card(880, 50, 330, 170, '大学后的我 · 起雾', ['做的事官僚、付出与回报不成正比 (6)', '常常忘记发生了什么 (7)', '两个月前看的书没印象 (8)']);
txt(1045, 250, '近视 · 脑雾 · 褪色', 'k', 19, 'middle');

card(1400, 50, 350, 170, '凌晨四五点 · 失控', ['选题被毙后边哭边写，骂自己', '对不起父母，对不起曾经的自己 (2)', '靠在衣柜上看可预约的医生']);

arrow(330, 120, 446, 120, C.b);
txt(388, 104, '长大', 'b', 18, 'middle');

arrow(760, 120, 876, 120, C.b);
txt(818, 104, '高考', 'b', 18, 'middle');
txt(818, 148, '建筑·城规 (6)', 'b', 16, 'middle');

arrow(1210, 120, 1396, 120, C.b);
txt(1303, 104, '申请季', 'b', 18, 'middle');
txt(1303, 148, '选题一次次被毙 (2)', 'b', 17, 'middle');

/* ---------- Right column: the night, then now ---------- */
arrow(1575, 220, 1575, 336, C.b);
txt(1587, 285, '做焦虑 / 抑郁自测', 'b', 17);

card(1400, 340, 350, 150, '想要一个"可控"的答案', ['觉得医院会给"置信度高的答案"', '"认为自己大概有病时，', '反而平静了" (2)']);

arrow(1575, 490, 1575, 596, C.b);
txt(1587, 540, '爸爸六点多进来发现了我', 'b', 17);
txt(1587, 566, '我请他们带我去医院', 'b', 17);

card(1400, 600, 350, 130, '现在的我', ['还是常常茫然、空洞 (8)', '对妈妈：烦，但更多是愧疚 (9)']);

arrow(1575, 730, 1575, 826, C.b);
txt(1587, 785, '变成故事', 'b', 18);

card(1400, 830, 350, 90, '→ 这个游戏 ?');

/* ---------- Inside my head (dashed) ---------- */
box(30, 330, 1300, 560, C.k, '9 7');
txt(38, 925, '我的脑子里', 'k', 24);
txt(38, 955, '(几个一直在说话的声音)', 'k', 17);

// childhood rebellion turns into guilt
curve(180, 220, 150, 300, 190, 366, C.r);
txt(40, 300, '反抗 → 愧疚', 'r', 18);

card(70, 370, 370, 120, '妈妈的声音', ['我对不起她的投资', '换个人更好，我让她丢脸 (9)']);
card(520, 370, 370, 120, '伤仲永', ['从小被当作聪明、早熟', '平庸 = 失败 = 罪，想被记住 (4)']);
card(950, 370, 350, 120, '追问者', ['为什么？我真的喜欢吗？', '我的感觉是真的吗？ (1)']);

arrow(444, 430, 516, 430, C.r);
txt(480, 414, '期望', 'r', 17, 'middle');

// mother loop
txt(255, 540, '没有自己想要的生活', 'r', 17, 'middle');
txt(255, 566, '→ 不如按她期望的活', 'r', 17, 'middle');
txt(255, 592, '→ 做不到，也不知道她期望什么', 'r', 17, 'middle');
txt(255, 618, '→ "她永远不会满意"', 'r', 17, 'middle');
curve(440, 470, 480, 560, 400, 630, C.r);
curve(100, 630, 30 + 20, 560, 80, 494, C.r);

// questioning loop
txt(1125, 540, '给出答案 → 被一一划掉', 'r', 17, 'middle');
txt(1125, 566, '→ 100% or nothing', 'r', 17, 'middle');
txt(1125, 592, '→ 否定自己的一切', 'r', 17, 'middle');
curve(1300, 450, 1330, 540, 1280, 600, C.r);
curve(970, 600, 930, 540, 960, 494, C.r);

card(70, 700, 250, 130, '想要自由', ['不喜欢规矩、一成不变', '羡慕数字游民']);
card(420, 700, 270, 130, '害怕未知', ['陌生环境、不可控的东西', '"其实挺喜欢高中的日子" (3)']);
arrow(324, 765, 416, 765, C.r, true);
txt(370, 750, '吵架', 'r', 17, 'middle');

card(985, 690, 320, 175, '被名字吸引', ['克林索尔的最后夏天', '仿生人会梦见电子羊吗 · 缸中之脑', '"但我也不知道为什么" (5)']);

/* ---------- The thread that runs through it (red) ---------- */
curve(1045, 268, 900, 320, 705, 366, C.r, true);
txt(1100, 304, '想要绝对  ⇄  越来越模糊', 'r', 21, 'start');

txt(330, 925, '想要绝对:', 'r', 20);
txt(430, 925, '永远做下去才算喜欢 (1)  ·  100% or nothing (1)  ·  平庸是罪 (4)', 'r', 18);
txt(430, 952, '医院给一个确定的答案 (2)  ·  她永远不会满意 (9)', 'r', 18);
txt(330, 994, '越来越模糊:', 'r', 20);
txt(450, 994, '起雾 · 近视 · 褪色 (7)(8)  ·  害怕未知 (3)  ·  不知道自己想要什么样的生活 (9)', 'r', 18);
txt(330, 1040, '→ 这一对矛盾，会不会就是故事的发动机？', 'r', 21);
wob(326, 1050, 760, 1052, C.r, 1.6);

/* legend */
txt(1400, 960, '蓝 = 发生了什么', 'b', 18);
txt(1400, 988, '红 = 脑子里的反应 / 循环', 'r', 18);
txt(1400, 1016, '(n) = 本子上的条目编号', 'k', 16);
</script>
</body>
</html>
